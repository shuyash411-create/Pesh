[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pesh"
version = "0.1.0"
description = "Pre-execution cost quotes, enforced ceilings and guaranteed pricing for AI agent runs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "pyarrow>=12",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "pydantic>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24", "ruff>=0.4"]

[project.scripts]
pesh = "pesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pesh = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical reproduction of the paper's experiments (E1-E5)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
